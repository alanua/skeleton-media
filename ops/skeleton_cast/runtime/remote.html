function openNativeKeyboard(){keyboardBuffer='';const input=$('nativeKeyboard');input.value='';input.focus({preventScroll:true});setTimeout(()=>{input.click();try{window.HomeApp?.showKeyboard?.()}catch(e){}},30)}
function keyboardLayout(text=''){if(/[іїєґІЇЄҐ]/.test(text))return'uk';if(/[А-Яа-яЁё]/.test(text))return'ru';return'en'}
async function sendKeyboardText(text){if(text)await jf('/api/remote/keyboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'text',text,key:'',layout:keyboardLayout(text)})})}
$('nativeKeyboard').addEventListener('input',e=>keyboardBuffer=e.target.value);$('nativeKeyboard').addEventListener('keydown',async e=>{if(e.key==='Enter'){e.preventDefault();await sendKeyboardText(keyboardBuffer);e.target.value='';keyboardBuffer=''}else if(['Backspace','Escape','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){if(e.key==='Backspace'&&e.target.value)return;e.preventDefault();await jf('/api/remote/keyboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'key',text:'',key:e.key,layout:keyboardLayout(e.target.value)})})}});
async function checkRemoteBuild(){try{const r=await fetch('/api/ui/build',{cache:'no-store'}),j=await r.json();if(r.ok&&j.build&&document.body.dataset.uiBuild&&j.build!==document.body.dataset.uiBuild)parent===window?location.reload():parent.postMessage({type:'skeleton:navigate',path:'/remote'},location.origin)}catch(e){}}
document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>sendSlot(b.dataset.slot)));
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>sendAction(b.dataset.action)));
document.querySelectorAll('[data-game-key]').forEach(bindGameButton);
window.addEventListener('blur',releaseAllGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAllGame()});
setView('remote');pollStatus();setTimeout(openRequestedTVEditor,120);pollRemoteVolume();setInterval(checkRemoteBuild,20000);window.addEventListener('pageshow',()=>{if(window.skeletonTabActive?.()){scheduleStatusRefresh(0);readVolume()}checkRemoteBuild()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){scheduleStatusRefresh(0);readVolume();checkRemoteBuild()}});
</script>
</body></html>
