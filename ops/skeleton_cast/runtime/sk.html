<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d10"><title>СК · Home</title><link rel="stylesheet" href="/static/ui.css?v=129"></head>
<body class="sk-page"><header class="app-tab-header"><div class="app-tab-copy"><strong>СК</strong><small><span>Skeleton · Home Edge</span><span class="online-dot"></span></small></div><div class="header-actions" data-home-header-actions></div></header>
<main class="sk-main"><section class="card sk-status-card"><div class="sk-title"><span class="mdi" style="--icon:url('/static/icons/mdi/server-network.svg')"></span><div><strong>Медіанода</strong><small id="skHealth">Перевіряю…</small></div></div><div class="sk-grid"><div><small>Режим</small><strong id="skMode">—</strong></div><div><small>Плеєр</small><strong id="skPlayer">—</strong></div><div><small>UI</small><strong id="skBuild">—</strong></div><div><small>Автопродовження</small><strong id="skAutoplay">—</strong></div><div><small>Скрінсейвер</small><strong id="skSaver">—</strong></div><div><small>Поточне</small><strong id="skTitle">—</strong></div></div></section><section class="card sk-tools"><a href="/remote" onclick="event.preventDefault();shellNavigate('/remote')"><span class="mdi" style="--icon:url('/static/icons/mdi/remote.svg')"></span><span>Пульт</span></a><a href="/video" onclick="event.preventDefault();shellNavigate('/video')"><span class="mdi" style="--icon:url('/static/icons/mdi/movie-open.svg')"></span><span>Відео</span></a><a href="/devices" onclick="event.preventDefault();shellNavigate('/devices')"><span class="mdi" style="--icon:url('/static/icons/mdi/devices.svg')"></span><span>Пристрої</span></a></section></main>
<nav class="bottom-nav"><a class="nav-item" href="/phone"><span class="mdi" style="--icon:url('/static/icons/mdi/home.svg')"></span><span>Головна</span></a><a class="nav-item" href="/video"><span class="mdi" style="--icon:url('/static/icons/mdi/movie-open.svg')"></span><span>Відео</span></a><a class="nav-item active" href="/sk"><span class="mdi" style="--icon:url('/static/icons/mdi/monitor-dashboard.svg')"></span><span>СК</span></a><a class="nav-item" href="/devices"><span class="mdi" style="--icon:url('/static/icons/mdi/devices.svg')"></span><span>Пристрої</span></a></nav><script src="/static/home-shell.js?v=129"></script><script>
const $=id=>document.getElementById(id);const text=(v,f='—')=>v==null||v===''?f:String(v);async function j(u){try{const r=await fetch(u,{cache:'no-store'});return r.ok?await r.json():{}}catch(_){return{}}}async function refresh(){const[h,p,r,a,s,b]=await Promise.all([j('/health'),j('/api/player'),j('/api/remote/status'),j('/api/video/autoplay'),j('/api/screensaver'),j('/api/ui/build')]);$('skHealth').textContent=h.status==='ok'||h.service?'Підключено':'Недоступно';$('skMode').textContent=text(r.mode||p.backend||'Home');$('skPlayer').textContent=p.running?(p.pause?'Пауза':'Відтворення'):'Зупинено';$('skBuild').textContent=text(b.build);$('skAutoplay').textContent=a.enabled?'Увімкнено':'Вимкнено';$('skSaver').textContent=s.enabled?'Увімкнено':'Вимкнено';$('skTitle').textContent=text(p['display-title']||p['media-title']);}let skTimer=0;function scheduleSk(delay){clearTimeout(skTimer);skTimer=setTimeout(pollSk,delay)}async function pollSk(){if(document.hidden||!window.skeletonTabActive?.()){scheduleSk(30000);return}await refresh();scheduleSk(5000)}window.addEventListener('skeleton:tab-visibility',e=>{if(e.detail?.active)scheduleSk(0)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.skeletonTabActive?.())scheduleSk(0)});scheduleSk(0);
</script></body></html>
