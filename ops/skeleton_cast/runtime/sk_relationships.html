<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;background:#111319;color:#e9edf4;font-family:system-ui,sans-serif;overflow:hidden}#graph{width:100%;height:100%;display:block}.link{stroke:#566171;stroke-opacity:.55}.node text{font-size:10px;fill:#dbe2ec;pointer-events:none}.hint{position:fixed;left:10px;bottom:8px;font-size:9px;color:#8d97a6;background:#111319dd;padding:4px 6px;border-radius:6px}.err{position:fixed;inset:0;display:none;place-items:center;padding:18px;color:#e9a2a2;font-size:11px;text-align:center;white-space:pre-wrap}</style></head><body><svg id="graph"></svg><div class="hint">drag · zoom · tap node</div><div id="err" class="err"></div><script>__D3_INLINE__</script><script>window.__skeletonD3Status='boot';window.onerror=(m,u,l,c)=>{window.__skeletonD3Status='error:'+m;const x=document.getElementById('err');x.style.display='grid';x.textContent='D3 error: '+m+' @'+l+':'+c;try{SkeletonD3.error(String(m)+' @'+l+':'+c)}catch(_){}};(()=>{try{const d=__SK_DATA__,domains=Array.isArray(d.domains)?d.domains:[];if(typeof d3==='undefined')throw new Error('D3 library not loaded');const nodes=[{id:'Skeleton',kind:'root',fresh:true},...domains.map((x,i)=>({id:x.title||('domain'+i),kind:'domain',fresh:!x.stale,level:x.level||'muted'}))],links=domains.map((x,i)=>({source:'Skeleton',target:x.title||('domain'+i)})),svg=d3.select('#graph'),W=Math.max(280,innerWidth),H=Math.max(280,innerHeight);svg.attr('viewBox',`0 0 ${W} ${H}`);const root=svg.append('g');svg.call(d3.zoom().scaleExtent([.6,3]).on('zoom',e=>root.attr('transform',e.transform)));const link=root.append('g').selectAll('line').data(links).join('line').attr('class','link').attr('stroke-width',1.2),node=root.append('g').selectAll('g').data(nodes).join('g').attr('class','node');node.append('circle').attr('r',x=>x.kind==='root'?25:14).attr('fill',x=>x.kind==='root'?'#6f5bd7':x.fresh?(x.level==='ok'?'#38b66b':'#8767d7'):'#66707e').attr('stroke','#cdd6e3').attr('stroke-opacity',.25);node.append('text').attr('text-anchor','middle').attr('dy',x=>x.kind==='root'?40:28).text(x=>x.id.length>22?x.id.slice(0,21)+'…':x.id);const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(x=>x.id).distance(78).strength(.75)).force('charge',d3.forceManyBody().strength(-210)).force('center',d3.forceCenter(W/2,H/2)).force('collision',d3.forceCollide().radius(x=>x.kind==='root'?38:28)).on('tick',()=>{link.attr('x1',x=>x.source.x).attr('y1',x=>x.source.y).attr('x2',x=>x.target.x).attr('y2',x=>x.target.y);node.attr('transform',x=>`translate(${x.x},${x.y})`)});node.call(d3.drag().on('start',(e,x)=>{if(!e.active)sim.alphaTarget(.25).restart();x.fx=x.x;x.fy=x.y}).on('drag',(e,x)=>{x.fx=e.x;x.fy=e.y}).on('end',(e,x)=>{if(!e.active)sim.alphaTarget(0);x.fx=null;x.fy=null}));node.on('click',(e,x)=>{e.stopPropagation();const c=new Set([x.id]);links.forEach(l=>{const a=l.source.id||l.source,b=l.target.id||l.target;if(a===x.id)c.add(b);if(b===x.id)c.add(a)});node.style('opacity',n=>c.has(n.id)?1:.16);link.style('opacity',l=>c.has(l.source.id||l.source)&&c.has(l.target.id||l.target)?1:.08)});svg.on('click',()=>{node.style('opacity',1);link.style('opacity',1)});if(nodes.length===1)throw new Error('No domain data');window.__skeletonD3Status='rendered:'+nodes.length+':'+links.length;console.log('Skeleton D3 rendered',nodes.length,links.length);try{SkeletonD3.rendered(nodes.length,links.length)}catch(_){}}catch(e){const x=document.getElementById('err');x.style.display='grid';window.__skeletonD3Status='error:'+(e&&e.message?e.message:e);x.textContent='D3 error: '+(e&&e.message?e.message:e);try{SkeletonD3.error(String(e&&e.message?e.message:e))}catch(_){}}})();</script></body></html>
