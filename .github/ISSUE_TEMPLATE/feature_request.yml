name: Feature request
description: Propose a media-domain improvement
title: "[feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What media workflow should improve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Repository boundary
      description: Explain why this belongs in Skeleton Media rather than the Skeleton control plane.
    validations:
      required: true
