name: Bug report
description: Report a reproducible Skeleton Media defect
title: "[bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Do not include secrets, private IPs, account identifiers, or personal media/history.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal reproducible steps and expected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public-safe evidence
      description: Sanitized logs, test output, or screenshots.
