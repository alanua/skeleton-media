name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SKELETON_SHA: 1f3d2d8310c9b35b5be6402eee555e45634c0c2c
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch pinned Skeleton control-plane contracts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/alanua/Skeleton.git "$RUNNER_TEMP/Skeleton"
          git -C "$RUNNER_TEMP/Skeleton" checkout --detach "$SKELETON_SHA"
          test "$(git -C "$RUNNER_TEMP/Skeleton" rev-parse HEAD)" = "$SKELETON_SHA"

      - name: Install Skeleton Media
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ runner.temp }}/Skeleton
        run: pytest -q
