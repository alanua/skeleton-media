name: Video Understanding Runtime Launch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/video-understanding-runtime-launch.yml"
      - "core/video_understanding/live_runtime.py"
      - "core/video_understanding/runtime_install.py"
      - "scripts/install_video_understanding_runtime.py"
      - "scripts/video_understanding_worker.py"
      - "tests/test_video_understanding_live_runtime.py"
      - "tests/test_video_understanding_runtime_install.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skeleton-video-understanding-runtime-launch
  cancel-in-progress: false

jobs:
  validate-and-launch:
    name: Validate and launch exact main
    if: github.repository == 'alanua/Skeleton' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - hetzner-agent-runner-1
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      INSTALL_RECEIPT: ${{ runner.temp }}/video-understanding-install-receipt.json
    steps:
      - name: Checkout exact source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: true

      - name: Verify exact main identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "alanua/Skeleton"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          checkout_ref="$(git rev-parse --abbrev-ref HEAD)"
          test "${checkout_ref}" = "HEAD" || test "${checkout_ref}" = "main"
          origin="$(git remote get-url origin)"
          test "${origin}" = "https://github.com/alanua/Skeleton" || \
            test "${origin}" = "https://github.com/alanua/Skeleton.git"

      - name: Validate Video Understanding suite
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_video_understanding_*.py
          python3 -m py_compile core/video_understanding/*.py scripts/video_understanding.py scripts/video_understanding_worker.py scripts/install_video_understanding_runtime.py

      - name: Restore clean exact checkout
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "${GITHUB_SHA}"
          git clean -fdx
          test -z "$(git status --porcelain)"

      - name: Install and activate private runtime
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_video_understanding_runtime.py \
            --expected-sha "${GITHUB_SHA}" \
            --enable > "${INSTALL_RECEIPT}"
          python3 - "${INSTALL_RECEIPT}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "source_merge_sha",
              "runtime_config_status",
              "provider_ready_count",
              "provider_required_count",
              "ollama_status",
              "sona_status",
              "artifact_store_status",
              "queue_recovery_status",
              "memory_gateway_status",
              "memory_roundtrip_status",
              "service_install_status",
              "service_active",
              "worker_count",
              "rollback_ready",
              "stable_reason_codes",
          }
          if set(payload) - (required | {"schema"}):
              raise SystemExit("unexpected public receipt field")
          if payload.get("source_merge_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("source SHA mismatch")
          if payload.get("runtime_config_status") != "READY":
              raise SystemExit("runtime config blocked")
          if payload.get("provider_ready_count") != payload.get("provider_required_count"):
              raise SystemExit("mandatory provider blocked")
          if payload.get("ollama_status") != "READY":
              raise SystemExit("Ollama blocked")
          if payload.get("memory_gateway_status") != "READY":
              raise SystemExit("MemoryGateway blocked")
          if payload.get("memory_roundtrip_status") != "DONE":
              raise SystemExit("MemoryGateway roundtrip blocked")
          if payload.get("service_active") is not True or payload.get("worker_count") != 1:
              raise SystemExit("worker activation failed")
          if payload.get("rollback_ready") is not True:
              raise SystemExit("rollback unavailable")
          PY

      - name: Verify active worker remains singular
        id: verify
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(systemctl --user is-active skeleton-video-understanding-worker.service)" = "active"
          main_pid="$(systemctl --user show skeleton-video-understanding-worker.service --property=MainPID --value)"
          test "${main_pid}" -gt 0

      - name: Publish aggregate launch receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          allowed = {
              "source_merge_sha",
              "runtime_config_status",
              "provider_ready_count",
              "provider_required_count",
              "ollama_status",
              "sona_status",
              "artifact_store_status",
              "queue_recovery_status",
              "memory_gateway_status",
              "memory_roundtrip_status",
              "service_install_status",
              "service_active",
              "worker_count",
              "rollback_ready",
              "stable_reason_codes",
          }
          outcomes = {
              "checkout": os.environ.get("CHECKOUT_OUTCOME", "unknown"),
              "identity": os.environ.get("IDENTITY_OUTCOME", "unknown"),
              "validate": os.environ.get("VALIDATE_OUTCOME", "unknown"),
              "restore": os.environ.get("RESTORE_OUTCOME", "unknown"),
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "verify": os.environ.get("VERIFY_OUTCOME", "unknown"),
          }
          receipt_path = pathlib.Path(os.environ["INSTALL_RECEIPT"])
          receipt = {}
          if receipt_path.is_file():
              try:
                  raw = json.loads(receipt_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  raw = {}
              if isinstance(raw, dict):
                  receipt = {key: raw[key] for key in allowed if key in raw}
          reasons = receipt.get("stable_reason_codes")
          if not isinstance(reasons, list):
              reasons = []
          if not receipt:
              reasons.append("INSTALL_RECEIPT_MISSING")
          failed_steps = [name for name, value in outcomes.items() if value not in {"success", "skipped"}]
          if failed_steps:
              reasons.extend(f"WORKFLOW_{name.upper()}_FAILED" for name in failed_steps)
          service_active = receipt.get("service_active") is True
          worker_count = receipt.get("worker_count")
          success = (
              all(outcomes[name] == "success" for name in ("checkout", "identity", "validate", "restore", "install", "verify"))
              and service_active
              and worker_count == 1
              and receipt.get("memory_roundtrip_status") == "DONE"
          )
          public = {
              "status": "DONE" if success else "BLOCKED",
              "source_merge_sha": os.environ["GITHUB_SHA"],
              "workflow_outcomes": outcomes,
              **receipt,
              "stable_reason_codes": sorted(set(str(value) for value in reasons)),
          }
          body = "Video Understanding runtime launch receipt.\n\n```json\n" + json.dumps(public, sort_keys=True) + "\n```"
          request = urllib.request.Request(
              "https://api.github.com/repos/alanua/Skeleton/issues/2028/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit("launch receipt publication failed")
          print(json.dumps(public, sort_keys=True))
          PY

      - name: Fail workflow when launch did not complete
        if: steps.install.outcome != 'success' || steps.verify.outcome != 'success'
        shell: bash
        run: exit 1
